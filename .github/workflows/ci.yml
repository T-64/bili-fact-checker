name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src server
      - run: pytest -q
      - run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m venv /tmp/bfc-smoke
          /tmp/bfc-smoke/bin/pip install dist/*.whl
          OPENAI_API_KEY=fixture /tmp/bfc-smoke/bin/bili-fact-checker doctor --json

  container:
    runs-on: ubuntu-latest
    env:
      BFC_API_TOKEN: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t bili-fact-checker:test .
      - name: Confirm non-root image user
        run: test "$(docker image inspect -f '{{.Config.User}}' bili-fact-checker:test)" = "10001:10001"
