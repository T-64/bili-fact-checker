name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: python -m compileall -q src server
      - run: pytest -q
      - run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m venv /tmp/bfc-smoke
          /tmp/bfc-smoke/bin/pip install dist/*.whl
          OPENAI_API_KEY=fixture /tmp/bfc-smoke/bin/bili-fact-checker doctor --json
      - name: pip-audit
        continue-on-error: true
        run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject committed private keys and live tokens
        run: |
          if git grep -I -nE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|sk-[A-Za-z0-9]{24,}|ghp_[A-Za-z0-9]{20,}' \
            -- ':!.github/workflows/ci.yml' ':!tests' ':!.env.example'; then
            echo 'possible secret found in the tree' >&2
            exit 1
          fi

  container:
    runs-on: ubuntu-latest
    env:
      BFC_API_TOKEN: 0123456789abcdef0123456789abcdef
      OPENAI_API_KEY: fixture-ci-key
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Confirm non-root image user
        run: test "$(docker image inspect -f '{{.Config.User}}' bili-fact-checker:local)" = "10001:10001"
      - name: Compose health smoke
        run: |
          docker compose up -d
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/health \
              && curl -fsS -H "Authorization: Bearer $BFC_API_TOKEN" http://127.0.0.1:8765/v1/status; then
              ok=1
              break
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          test "$ok" = 1
