services:
  app:
    build: .
    image: bili-fact-checker:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.z.ai/api/paas/v4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-glm-4-flash}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-auto}
      BFC_SEARCH_API_BASE: ${BFC_SEARCH_API_BASE:-}
      BFC_SEARCH_API_KEY: ${BFC_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BILI_SESSDATA: ${BILI_SESSDATA:-}
      BFC_API_TOKEN: ${BFC_API_TOKEN:?Set a random BFC_API_TOKEN of at least 32 characters}
      SEARXNG_URL: ${SEARXNG_URL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,searxng}
    volumes:
      - bfc-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  searxng:
    image: searxng/searxng:latest
    profiles: ["searxng"]
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - searxng-data:/etc/searxng
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bfc-data:
  searxng-data:
