[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-fact-checker"
version = "1.0.0"
description = "Bilibili oral-content analysis and evidence-backed fact checking (CLI / API / Agent Skill)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "T-64" }]
keywords = ["bilibili", "fact-check", "subtitle", "asr", "llm"]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "qrcode>=7.4",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "yt-dlp>=2025.1"]
local-ml = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8.0", "ruff>=0.6", "pip-audit>=2.7"]
e2e = ["playwright>=1.40"]

[project.scripts]
bili-fact-checker = "bili_fact_checker.cli:main"
bili-fact-checker-server = "bili_fact_checker.api.app:main"

[project.urls]
Homepage = "https://github.com/T-64/bili-fact-checker"
Repository = "https://github.com/T-64/bili-fact-checker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bili_fact_checker = ["web_dist/*.html", "web_dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]
